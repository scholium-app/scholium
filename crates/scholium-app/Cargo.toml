[package]
name = "scholium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hayro-syntax = "=0.8.0"
time = { version = "=0.3.55", features = ["local-offset"] }
scholium-latex = { path = "../scholium-latex", version = "0.1.0" }
scholium-build = { path = "../scholium-build", version = "0.1.0" }
tokio = { version = "=1.53.3", features = ["rt", "time", "sync", "macros"] }
tempfile = "=3.27.0"
scholium-math-input = { path = "../scholium-math-input", version = "0.1.0" }
toml = "=0.8.23"
serde = { version = "=1.0.229", features = ["derive"] }
scholium-session = { path = "../scholium-session", version = "0.1.0" }
eframe.workspace = true
unicode-segmentation = "=1.13.3"
fluent-bundle = "=0.16.0"
thiserror = "=2.0.20"
serde_json = "=1.0.151"
# Icon rasterizer and font database: already in the graph through typst-render / typst-kit.
resvg = { version = "=0.47.0", default-features = false }
fontdb = "=0.23.0"
scholium-model = { path = "../scholium-model", version = "0.1.0" }
scholium-document = { path = "../scholium-document", version = "0.1.0" }
scholium-typst = { path = "../scholium-typst", version = "0.1.0", features = ["editor"] }
scholium-storage = { path = "../scholium-storage", version = "0.1.0" }

[lints]
workspace = true
