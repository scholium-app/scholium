[package]
name = "scholium-typst"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[features]
# Requires the complete pinned fork group patched in at the workspace root.
editor = ["dep:comemo", "dep:thiserror", "typst-layout/editor"]

[dependencies]
comemo = { version = "=0.5.1", optional = true }
thiserror = { version = "=2.0.20", optional = true }
scholium-model = { path = "../scholium-model", version = "0.1.0" }
unicode-segmentation = "=1.13.3"
# 与 spikes/typst-mapping 实测锁定的同一版本组；升级须重跑映射与延迟基准。
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "=0.15.1"
typst-render = "=0.15.1"

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.151"

# Fork/stock pixel parity: compare with spikes/typst-main-editor/reference (stock registry Typst).
[[example]]
name = "typst-main-fork-check"
path = "../../spikes/typst-main-editor/fork-check.rs"
required-features = ["editor"]
