[package]
name = "scholium-latex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
scholium-model = { path = "../scholium-model", version = "0.1.0" }
scholium-build = { path = "../scholium-build", version = "0.1.0" }
thiserror = "=2.0.20"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["process", "io-util", "time", "sync", "rt", "macros"] }

hayro = "=0.8.0"
skrifa = "=0.46.0"
tiny-skia = "=0.12.0"
tempfile = "=3.27.0"

[dev-dependencies]
nix = { version = "=0.31.3", features = ["signal", "process"] }

[lints]
workspace = true
