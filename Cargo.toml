[workspace]
resolver = "2"
exclude = ["vendor/typst-edit", "vendor/accesskit_atspi_common"]
members = ["crates/scholium-app", "crates/scholium-model", "crates/scholium-document", "crates/scholium-typst", "crates/scholium-storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

# One Typst version group for every build: the default editor needs the edit-origin
# patches (ADR 0036). scripts/verify-typst-fork.py rebuilds it from upstream plus tracked patches.
[patch.crates-io]
typst = { path = "vendor/typst-edit/crates/typst" }
typst-eval = { path = "vendor/typst-edit/crates/typst-eval" }
typst-html = { path = "vendor/typst-edit/crates/typst-html" }
typst-kit = { path = "vendor/typst-edit/crates/typst-kit" }
typst-layout = { path = "vendor/typst-edit/crates/typst-layout" }
typst-library = { path = "vendor/typst-edit/crates/typst-library" }
typst-macros = { path = "vendor/typst-edit/crates/typst-macros" }
typst-realize = { path = "vendor/typst-edit/crates/typst-realize" }
typst-render = { path = "vendor/typst-edit/crates/typst-render" }
typst-svg = { path = "vendor/typst-edit/crates/typst-svg" }
typst-syntax = { path = "vendor/typst-edit/crates/typst-syntax" }
typst-timing = { path = "vendor/typst-edit/crates/typst-timing" }
typst-utils = { path = "vendor/typst-edit/crates/typst-utils" }
# Disabled controls must not be reported Enabled/Sensitive to AT-SPI (ADR 0038, from ADR 0021).
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
unwrap_used = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
missing_docs = "warn"
