# 依赖许可与安全门禁。允许清单见 AGENT.md 的「许可证政策」。
#
# 用法：在任一 workspace 目录下执行 `cargo deny check`；
# cargo-deny 会向上查找本文件，因此根目录一份即可覆盖所有 crate。

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
# 与 AGENT.md 的允许类别逐项对应。新增类别必须先改政策并走 ADR。
allow = [
    "MIT",
    "Apache-2.0",
    # Apache-2.0 的附带例外，权限严格宽于 Apache-2.0；依据见 ADR 0005。
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License：宽松许可，与 MIT 同类；依据见 ADR 0010。
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # MPL-2.0：仅作文件级 copyleft 依赖；修改其文件时按 MPL 公开该文件。
    "MPL-2.0",
    # 字体资产许可（仅限未修改的字体）：依据见 ADR 0011。
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# 路径依赖没有版本号，wildcards="deny" 会误伤它们；仍然禁止 registry 依赖用通配版本。
allow-wildcard-paths = true
deny = [
    # 明确禁止：受限许可或与"不得引入 WebView"冲突的实现。
    { name = "slint" },
    { name = "wry" },
    { name = "tauri" },
]

[advisories]
version = 2
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
