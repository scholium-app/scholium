name: Rust workspace
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - name: Install native build dependencies
        timeout-minutes: 6
        run: bash scripts/install-ci-native-deps.sh libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/check-rust-size.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
  typst-editor-window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: window
          workspaces: |
            . -> target
            spikes/typst-main-editor/reference -> target/stock-reference
      - name: Install native build and window dependencies
        timeout-minutes: 6
        run: bash scripts/install-ci-native-deps.sh libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev xvfb xdotool xclip imagemagick fonts-noto-cjk at-spi2-core dbus python3-gi gir1.2-atspi-2.0
      - name: Check native X11 runtime libraries
        run: python3 -c 'import ctypes; ctypes.CDLL("libxkbcommon-x11.so.0"); ctypes.CDLL("libX11.so.6")'
      - name: Rebuild the pinned fork from upstream objects
        run: |
          git init /tmp/typst-origin
          git -C /tmp/typst-origin fetch --depth 1 https://github.com/typst/typst.git 9dfd3a08500b7896045f907433cf7b4b02434fad
          python3 scripts/verify-typst-fork.py /tmp/typst-origin > /tmp/typst-fork-source.json
      - run: cargo build --locked -p scholium-app -p scholium-storage --bins
      - name: Compare formal Content adapter with independent stock Typst
        run: |
          cargo run --locked -p scholium-typst --features editor --example typst-main-fork-check -- /tmp/typst-fork-pixels
          cargo run --locked --manifest-path spikes/typst-main-editor/reference/Cargo.toml --target-dir target/stock-reference -- /tmp/typst-stock-pixels
          python3 spikes/typst-main-editor/compare.py /tmp/typst-fork-pixels /tmp/typst-stock-pixels > /tmp/typst-stock-comparison.json
      - name: Real-window checks (discovered by scripts/window-checks.py)
        timeout-minutes: 20
        run: python3 scripts/window-checks.py --out /tmp/scholium-window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typst-main-native-evidence
          path: |
            /tmp/scholium-window
            /tmp/typst-fork-source.json
            /tmp/typst-stock-comparison.json
