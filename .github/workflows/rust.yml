name: Rust workspace
# Documentation-only changes skip this workflow; docs.yml checks their links instead.
# The fork-vs-stock pixel comparison runs only when the fork changes (typst-fork.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Every workflow pins the same runner image explicitly (never ubuntu-latest): an image change
# alters Xvfb, xkb-data and xdotool under the real-window checks, so it lands as a reviewed PR.
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
          cache-key: lint
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny --locked check licenses bans sources
      - name: Repository gates
        run: |
          python3 scripts/check-layers.py
          python3 scripts/check-rust-size.py
          python3 scripts/check-ui-strings.py
          python3 scripts/check-doc-links.py
  # Unit tests and both locales of the real-window checks share one build.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          packages: >-
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev xvfb xdotool xclip
            imagemagick fonts-noto-cjk at-spi2-core dbus python3-gi gir1.2-atspi-2.0
      - run: cargo build --locked --workspace --bins
      - run: cargo test --locked --workspace
      - name: Real-window checks (discovered by scripts/window-checks.py)
        timeout-minutes: 25
        run: python3 scripts/window-checks.py --locale zh-Hans en --out /tmp/scholium-window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-evidence
          path: /tmp/scholium-window
