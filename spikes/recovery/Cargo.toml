[package]
name = "scholium-spike-recovery"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# 独立 workspace：验证代码不进正式 workspace 的依赖图。
[workspace]

[dependencies]
# 文档模型复用阶段 0 第 1 项的共享核心（只读，不作为持久化格式）。
scholium-spike-core = { path = "../native-ui/core" }
thiserror = "=2.0.20"
# WAL 每条记录带 CRC-32 校验和；crc32fast 是 Apache-2.0/MIT 双许可，纯 Rust。
crc32fast = "=1.5.2"
# 崩溃夹具要向自己发 SIGKILL；libc 是 MIT/Apache-2.0。
libc = "=0.2.189"
# 外部修改冲突用 SHA-256 内容哈希。放在 dependencies 而不是 dev-dependencies：
# 冲突检测是判据本身的实现，不是测试脚手架。
sha2 = "=0.10.9"
# Typst 引擎，锁定与阶段 0 第 2 项相同的版本。
typst = "=0.15.1"
# PagedDocument 在 typst-layout 里，需要直接依赖。
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
# 字体来源（内置 + 系统扫描）。
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts"] }
# 随机截断用固定种子。注意：这些是**可执行判据的实现依赖**，必须放在
# [dependencies] 而不是 [dev-dependencies] —— 二进制目标看不到 dev-dependencies，
# 放错位置会在 cargo build 阶段直接编译失败。
rand = "=0.9.5"

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
unwrap_used = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "deny"

[lints.rust]
missing_docs = "warn"
