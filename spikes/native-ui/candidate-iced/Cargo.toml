[package]
name = "scholium-spike-iced"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# 独立 workspace：候选不共享 workspace，避免 feature 合并与锁定版本互相影响。
[workspace]

[dependencies]
scholium-spike-core = { path = "../core" }
# 锁定候选版本；具体版本与 feature 由验证报告记录。
# `advanced` 用于取得 input_method 事件类型（输入法预编辑与提交）。
iced = { version = "=0.14.0", features = ["advanced"] }

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
unwrap_used = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "deny"

[lints.rust]
missing_docs = "warn"
