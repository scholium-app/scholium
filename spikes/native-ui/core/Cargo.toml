[package]
name = "scholium-spike-core"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# 独立 workspace：验证代码不进正式 workspace 的依赖图，各候选之间也不共享 feature 解析。
[workspace]

[dependencies]
# 精确锁定：本机 cargo registry 为只读挂载，只有这些版本已缓存，离线构建依赖它们。
thiserror = "=2.0.20"
unicode-segmentation = "=1.13.3"

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
unwrap_used = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "deny"

[lints.rust]
missing_docs = "warn"
